<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PZ Storee</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family: Arial, Helvetica, sans-serif;

    background: #050505;

    color: white;

    overflow-x: hidden;
}


/* =========================
   FONDO
========================= */

body::before {

    content: "";

    position: fixed;

    width: 900px;

    height: 600px;

    top: -300px;

    left: -300px;

    border-radius: 50%;

    background:
    radial-gradient(
        ellipse,
        rgba(255,255,255,0.15),
        rgba(120,120,120,0.08),
        transparent 70%
    );

    z-index: -2;
}


body::after {

    content: "";

    position: fixed;

    width: 900px;

    height: 600px;

    bottom: -300px;

    right: -300px;

    border-radius: 50%;

    background:
    radial-gradient(
        ellipse,
        rgba(255,255,255,0.14),
        rgba(120,120,120,0.08),
        transparent 70%
    );

    z-index: -2;
}


/* ONDAS */

.waves {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -1;
}


.wave {

    position: absolute;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.13);

    transform: rotate(-20deg);
}


.wave:nth-child(1) {

    width: 900px;

    height: 500px;

    top: -250px;

    left: -250px;
}


.wave:nth-child(2) {

    width: 1000px;

    height: 550px;

    top: -220px;

    left: -280px;

    border-color: rgba(255,255,255,0.09);
}


.wave:nth-child(3) {

    width: 1100px;

    height: 600px;

    top: -190px;

    left: -310px;

    border-color: rgba(150,150,150,0.10);
}


.wave:nth-child(4) {

    width: 1000px;

    height: 550px;

    bottom: -300px;

    right: -300px;
}


.wave:nth-child(5) {

    width: 1100px;

    height: 600px;

    bottom: -330px;

    right: -330px;

    border-color: rgba(150,150,150,0.10);
}


/* =========================
   MENÚ
========================= */

nav {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    z-index: 100;

    padding: 18px 25px;

    background: rgba(0,0,0,0.75);

    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255,255,255,0.08);
}


.nav-content {

    max-width: 1100px;

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.nav-name {

    font-weight: bold;

    letter-spacing: 2px;
}


.nav-links {

    display: flex;

    gap: 25px;
}


.nav-links a {

    color: white;

    text-decoration: none;

    font-size: 12px;

    letter-spacing: 1px;
}


/* =========================
   INICIO
========================= */

#inicio {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 100px 20px 60px;
}


.logo {

    width: 240px;

    max-width: 75vw;

    height: auto;

    display: block;

    margin-bottom: 25px;

    object-fit: contain;

    filter:
    drop-shadow(
        0 10px 30px rgba(255,255,255,0.10)
    );
}


.fallback {

    font-size: 45px;

    font-weight: 900;

    letter-spacing: 7px;

    margin-bottom: 25px;
}


.subtitle {

    color: #aaa;

    font-size: 13px;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 35px;
}


.btn {

    display: inline-block;

    padding: 15px 32px;

    background: white;

    color: black;

    text-decoration: none;

    font-weight: bold;

    font-size: 12px;

    letter-spacing: 1px;

    transition: 0.25s;
}


.btn:hover {

    background: transparent;

    color: white;

    border: 1px solid white;
}


/* =========================
   PRODUCTOS
========================= */

#productos {

    max-width: 1100px;

    margin: auto;

    padding: 100px 20px;
}


.section-title {

    text-align: center;

    margin-bottom: 50px;
}


.section-title h2 {

    font-size: 30px;

    letter-spacing: 4px;

    margin-bottom: 10px;
}


.section-title p {

    color: #888;

    font-size: 13px;
}


.products {

    display: grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(240px, 1fr)
    );

    gap: 25px;
}


.product {

    background: rgba(12,12,12,0.90);

    border: 1px solid rgba(255,255,255,0.10);

    padding: 18px;

    transition: 0.3s;
}


.product:hover {

    transform: translateY(-5px);

    border-color: rgba(255,255,255,0.30);
}


.product-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    object-fit: contain;

    background: #090909;

    margin-bottom: 18px;
}


.product h3 {

    font-size: 17px;

    margin-bottom: 8px;
}


.price {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 18px;
}


/* =========================
   TALLAS
========================= */

.size-title {

    color: #999;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 9px;
}


.sizes {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 18px;
}


.size {

    background: #111;

    color: white;

    border: 1px solid #333;

    padding: 8px 10px;

    cursor: pointer;

    font-size: 12px;

    transition: 0.2s;
}


.size:hover,
.size.selected {

    background: white;

    color: black;

    border-color: white;
}


.buy-btn {

    width: 100%;

    padding: 13px;

    background: white;

    color: black;

    border: none;

    cursor: pointer;

    font-weight: bold;

    letter-spacing: 1px;
}


.buy-btn:hover {

    background: #ddd;
}


/* =========================
   CARRITO
========================= */

.cart {

    position: fixed;

    right: 20px;

    bottom: 20px;

    z-index: 200;

    background: white;

    color: black;

    padding: 14px 18px;

    border-radius: 30px;

    font-weight: bold;

    font-size: 12px;

    cursor: pointer;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.5);
}


/* =========================
   FOOTER
========================= */

footer {

    text-align: center;

    padding: 70px 20px 40px;

    color: #666;

    font-size: 12px;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .nav-links {

        gap: 12px;
    }

    .nav-links a {

        font-size: 9px;
    }

    .logo {

        width: 190px;
    }

    .fallback {

        font-size: 32px;
    }
}

</style>

</head>


<body>


<!-- FONDO DE ONDAS -->

<div class="waves">

    <div class="wave"></div>

    <div class="wave"></div>

    <div class="wave"></div>

    <div class="wave"></div>

    <div class="wave"></div>

</div>


<!-- MENÚ -->

<nav>

    <div class="nav-content">

        <div class="nav-name">
            PZ STOREE
        </div>

        <div class="nav-links">

            <a href="#inicio">
                INICIO
            </a>

            <a href="#productos">
                PRODUCTOS
            </a>

        </div>

    </div>

</nav>


<!-- =========================
     INICIO
========================= -->

<section id="inicio">


    <!--
    AQUÍ VA EL LOGO

    CAMBIA logo.png POR EL NOMBRE
    EXACTO DEL ARCHIVO DE TU LOGO
    -->

    <img
      src="18339.jpg"
        alt="PZ Storee"
        class="logo"
        onerror="
        this.style.display='none';
        document.getElementById('fallback').style.display='block';
        "
    >


    <div
        id="fallback"
        class="fallback"
        style="display:none;"
    >
        PZ STOREE
    </div>


    <p class="subtitle">

        TU ESTILO. TU ESENCIA.

    </p>


    <a
        href="#productos"
        class="btn"
    >

        VER PRODUCTOS

    </a>


</section>


<!-- =========================
     PRODUCTOS
========================= -->

<section id="productos">


    <div class="section-title">

        <h2>
            PRODUCTOS
        </h2>

        <p>
            Encuentra tu próximo estilo.
        </p>

    </div>


    <div class="products">


        <!-- =========================
             RETRO 4
        ========================== -->

        <div class="product">


            <!--
            CAMBIA retro4.jpg POR EL NOMBRE
            EXACTO DE LA FOTO
            -->

            <img
                src="retro4.jpg"
                alt="Retro 4"
                class="product-image"
            >


            <h3>
                Retro 4
            </h3>


            <!-- CAMBIA EL PRECIO -->

            <div class="price">

                $XX.XXX

            </div>


            <div class="size-title">

                SELECCIONA TU TALLA

            </div>


            <div class="sizes">


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    36
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    37
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    38
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    39
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    40
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    41
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    42
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    43
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    44
                </button>


                <button
                    class="size"
                    onclick="selectSize(this)"
                >
                    45
                </button>


            </div>


            <button
                class="buy-btn"
                onclick="buyInstagram(this)"
            >

                CONSULTAR POR INSTAGRAM

            </button>


        </div>


    </div>

</section>


<!-- CARRITO -->

<div
    class="cart"
    onclick="showCart()"
>

    🛒 CARRITO
    (<span id="cart-count">0</span>)

</div>


<footer>

    © 2026 PZ Storee

</footer>


<script>


/* =========================
   CARRITO
========================= */

let cart = [];


/* =========================
   SELECCIONAR TALLA
========================= */

function selectSize(button) {


    const product =
        button.closest(".product");


    product
        .querySelectorAll(".size")
        .forEach(
            btn =>
            btn.classList.remove("selected")
        );


    button.classList.add("selected");

}


/* =========================
   INSTAGRAM
========================= */

function buyInstagram(button) {


    const product =
        button.closest(".product");


    const selected =
        product.querySelector(
            ".size.selected"
        );


    if (!selected) {

        alert(
            "Primero selecciona una talla."
        );

        return;

    }


    const size =
        selected.textContent.trim();


    cart.push({

        product: "Retro 4",

        size: size

    });


    document.getElementById(
        "cart-count"
    ).textContent = cart.length;


    /*
    CAMBIA pzz.storee POR TU USUARIO
    EXACTO DE INSTAGRAM.
    */

    const instagram =
        "https://www.instagram.com/pzz.storee/";


    window.open(
        instagram,
        "_blank"
    );

}


/* =========================
   VER CARRITO
========================= */

function showCart() {


    if (cart.length === 0) {

        alert(
            "Tu carrito está vacío."
        );

        return;

    }


    let message =
        "Productos seleccionados:\n\n";


    cart.forEach(
        (item, index) => {

            message +=
                `${index + 1}. ${item.product} - Talla ${item.size}\n`;

        }
    );


    alert(message);

}

</script>


</body>

</html>
