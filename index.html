<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PZ Storee</title>

    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }


        /* =====================================================
           FONDO
           NEGRO + TRAZOS TIPO LÁPIZ / AURORA
        ===================================================== */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            background: #050505;
            overflow: hidden;
            pointer-events: none;
        }


        /* Luz suave de fondo */

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.16;
        }

        .glow-one {
            width: 550px;
            height: 300px;
            background: #ffffff;
            top: -100px;
            left: -180px;
            transform: rotate(-25deg);
        }

        .glow-two {
            width: 500px;
            height: 280px;
            background: #aaaaaa;
            bottom: -80px;
            right: -150px;
            transform: rotate(25deg);
        }

        .glow-three {
            width: 350px;
            height: 200px;
            background: #dddddd;
            top: 45%;
            right: -180px;
            filter: blur(110px);
            opacity: 0.10;
        }


        /* =====================================================
           TRAZOS
        ===================================================== */

        .stroke {
            position: absolute;
            height: 2px;
            border-radius: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.20),
                rgba(255,255,255,0.75),
                rgba(210,210,210,0.35),
                transparent
            );

            filter: blur(1px);
            opacity: 0.75;
            transform-origin: center;
        }


        /* =====================================================
           LADO IZQUIERDO
        ===================================================== */

        .stroke-left-1 {
            width: 420px;
            left: -130px;
            top: 13%;
            transform: rotate(-22deg);
        }

        .stroke-left-2 {
            width: 320px;
            left: -90px;
            top: 27%;
            transform: rotate(18deg);
            opacity: 0.50;
        }

        .stroke-left-3 {
            width: 500px;
            left: -190px;
            top: 68%;
            transform: rotate(-13deg);
            opacity: 0.65;
        }

        .stroke-left-4 {
            width: 280px;
            left: -60px;
            top: 82%;
            transform: rotate(25deg);
            opacity: 0.40;
        }


        /* =====================================================
           LADO DERECHO
        ===================================================== */

        .stroke-right-1 {
            width: 430px;
            right: -150px;
            top: 16%;
            transform: rotate(21deg);
        }

        .stroke-right-2 {
            width: 300px;
            right: -80px;
            top: 31%;
            transform: rotate(-17deg);
            opacity: 0.48;
        }

        .stroke-right-3 {
            width: 520px;
            right: -210px;
            top: 66%;
            transform: rotate(15deg);
            opacity: 0.62;
        }

        .stroke-right-4 {
            width: 300px;
            right: -80px;
            top: 84%;
            transform: rotate(-24deg);
            opacity: 0.42;
        }


        /* =====================================================
           TRAZOS EXTRA MUY SUAVES
        ===================================================== */

        .soft-stroke {
            position: absolute;
            height: 5px;
            border-radius: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.08),
                rgba(255,255,255,0.28),
                transparent
            );

            filter: blur(5px);
        }

        .soft-left {
            width: 500px;
            left: -180px;
            top: 45%;
            transform: rotate(-10deg);
        }

        .soft-right {
            width: 500px;
            right: -180px;
            top: 50%;
            transform: rotate(12deg);
        }


        /* =====================================================
           BARRA DE NAVEGACIÓN
        ===================================================== */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;

            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            z-index: 100;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        nav a:hover {
            opacity: 0.6;
        }


        /* =====================================================
           INICIO
        ===================================================== */

        #inicio {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 100px 20px 60px;
        }

        .hero {
            max-width: 700px;
            width: 100%;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 35px;
        }

        .logo {
            width: 210px;
            max-width: 70vw;
            height: auto;

            object-fit: contain;

            filter:
                drop-shadow(0 0 15px rgba(255,255,255,0.10))
                drop-shadow(0 0 35px rgba(255,255,255,0.06));
        }


        /* =====================================================
           TEXTO PRINCIPAL
        ===================================================== */

        .hero h1 {
            font-size: clamp(32px, 6vw, 65px);
            font-weight: 500;
            letter-spacing: 7px;
            margin-bottom: 18px;
        }

        .hero p {
            color: #a9a9a9;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }


        /* =====================================================
           BOTÓN
        ===================================================== */

        .main-button {
            display: inline-block;

            padding: 15px 30px;

            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 2px;

            color: white;
            text-decoration: none;

            font-size: 12px;
            letter-spacing: 2px;

            transition: 0.3s;

            background: rgba(255,255,255,0.03);
        }

        .main-button:hover {
            background: white;
            color: black;
        }


        /* =====================================================
           PRODUCTOS
        ===================================================== */

        #productos {
            min-height: 100vh;
            padding: 120px 25px 100px;
        }

        .products-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .products-title h2 {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 5px;
        }

        .products-title p {
            margin-top: 12px;
            color: #888;
            font-size: 13px;
        }


        /* =====================================================
           PRODUCTO DE PRUEBA
        ===================================================== */

        .product-container {
            max-width: 430px;
            margin: auto;

            padding: 30px;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.10);

            backdrop-filter: blur(12px);

            text-align: center;

            border-radius: 5px;
        }

        .product-placeholder {
            height: 330px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #555;

            border: 1px dashed rgba(255,255,255,0.15);

            margin-bottom: 25px;

            font-size: 13px;
            letter-spacing: 2px;
        }

        .product-name {
            font-size: 21px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .price {
            color: #ddd;
            font-size: 17px;
            margin-bottom: 25px;
        }


        /* =====================================================
           TALLAS
        ===================================================== */

        .sizes-title {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .sizes {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;

            margin-bottom: 25px;
        }

        .size {
            width: 40px;
            height: 40px;

            border: 1px solid rgba(255,255,255,0.2);

            background: transparent;
            color: white;

            cursor: pointer;

            transition: 0.2s;
        }

        .size:hover {
            border-color: white;
        }

        .size.selected {
            background: white;
            color: black;
            border-color: white;
        }


        /* =====================================================
           BOTÓN INSTAGRAM
        ===================================================== */

        .instagram-button {
            width: 100%;

            padding: 15px;

            border: 1px solid rgba(255,255,255,0.6);

            background: white;
            color: black;

            cursor: pointer;

            font-size: 12px;
            letter-spacing: 2px;

            transition: 0.3s;
        }

        .instagram-button:hover {
            background: transparent;
            color: white;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            text-align: center;

            padding: 50px 20px;

            color: #555;

            font-size: 11px;

            letter-spacing: 2px;
        }


        /* =====================================================
           MÓVIL
        ===================================================== */

        @media (max-width: 600px) {

            nav {
                padding: 0 18px;
                height: 60px;
            }

            nav a {
                margin-left: 12px;
                font-size: 11px;
            }

            .nav-logo {
                font-size: 14px;
            }

            .logo {
                width: 170px;
            }

            .hero h1 {
                font-size: 34px;
                letter-spacing: 4px;
            }

            .hero p {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .stroke-left-1,
            .stroke-right-1 {
                width: 300px;
            }

            .stroke-left-3,
            .stroke-right-3 {
                width: 350px;
            }

            .product-container {
                padding: 20px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         FONDO
    ===================================================== -->

    <div class="background">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>

        <!-- Izquierda -->

        <div class="stroke stroke-left-1"></div>
        <div class="stroke stroke-left-2"></div>
        <div class="stroke stroke-left-3"></div>
        <div class="stroke stroke-left-4"></div>

        <!-- Derecha -->

        <div class="stroke stroke-right-1"></div>
        <div class="stroke stroke-right-2"></div>
        <div class="stroke stroke-right-3"></div>
        <div class="stroke stroke-right-4"></div>

        <!-- Trazos difuminados -->

        <div class="soft-stroke soft-left"></div>
        <div class="soft-stroke soft-right"></div>

    </div>


    <!-- =====================================================
         NAVEGACIÓN
    ===================================================== -->

    <nav>

        <div class="nav-logo">
            PZ STOREE
        </div>

        <div>
            <a href="#inicio">INICIO</a>
            <a href="#productos">PRODUCTOS</a>
        </div>

    </nav>


    <!-- =====================================================
         INICIO
    ===================================================== -->

    <section id="inicio">

        <div class="hero">

            <div class="logo-container">

                <img
                    src="18339.jpg"
                    alt="PZ Storee"
                    class="logo"
                >

            </div>


            <h1>PZ STOREE</h1>

            <p>
                ESTILO · CALIDAD · ORIGINALIDAD
            </p>


            <a
                href="#productos"
                class="main-button"
            >
                VER PRODUCTOS
            </a>

        </div>

    </section>


    <!-- =====================================================
         PRODUCTOS
    ===================================================== -->

    <section id="productos">

        <div class="products-title">

            <h2>PRODUCTOS</h2>

            <p>
                Descubre nuestra colección
            </p>

        </div>


        <div class="product-container">

            <div class="product-placeholder">
                IMAGEN DEL PRODUCTO
            </div>


            <div class="product-name">
                RETRO 4
            </div>


            <div class="price">
                $XX.XXX
            </div>


            <div class="sizes-title">
                SELECCIONA TU TALLA
            </div>


            <div class="sizes">

                <button class="size" onclick="selectSize(this)">
                    36
                </button>

                <button class="size" onclick="selectSize(this)">
                    37
                </button>

                <button class="size" onclick="selectSize(this)">
                    38
                </button>

                <button class="size" onclick="selectSize(this)">
                    39
                </button>

                <button class="size" onclick="selectSize(this)">
                    40
                </button>

                <button class="size" onclick="selectSize(this)">
                    41
                </button>

                <button class="size" onclick="selectSize(this)">
                    42
                </button>

                <button class="size" onclick="selectSize(this)">
                    43
                </button>

                <button class="size" onclick="selectSize(this)">
                    44
                </button>

                <button class="size" onclick="selectSize(this)">
                    45
                </button>

            </div>


            <button
                class="instagram-button"
                onclick="openInstagram()"
            >
                CONSULTAR POR INSTAGRAM
            </button>

        </div>

    </section>


    <!-- =====================================================
         PIE DE PÁGINA
    ===================================================== -->

    <footer>

        PZ STOREE · TODOS LOS DERECHOS RESERVADOS

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        function selectSize(button) {

            const allSizes =
                document.querySelectorAll(".size");

            allSizes.forEach(function(size) {
                size.classList.remove("selected");
            });

            button.classList.add("selected");

        }


        function openInstagram() {

            const selected =
                document.querySelector(".size.selected");

            if (!selected) {

                alert("Primero selecciona una talla.");

                return;

            }


            const size =
                selected.textContent.trim();


            const instagram =
                "https://www.instagram.com/pzz.storee/";


            window.open(
                instagram,
                "_blank"
            );

        }

    </script>

</body>
</html>
